plugins { id 'java-library' }
sourceSets {
    main.java { srcDirs = ['../src/main/java']; include 'org/drvo/reggisapp/report/XlsReportExporter.java' }
    test.java { srcDirs = ['../src/test/java']; include 'org/drvo/reggisapp/report/**' }
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies {
    api project(':core')
    implementation 'org.apache.poi:poi:5.5.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}
tasks.named('test') { useJUnitPlatform() }
