plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    def signingFile = rootProject.file('../.signing/beta.properties')
    if (signingFile.exists()) {
        def secrets = new Properties()
        signingFile.withInputStream { secrets.load(it) }
        signingConfigs {
            beta {
                storeFile rootProject.file('../.signing/reggis-beta.p12')
                storePassword secrets.getProperty('password')
                keyAlias 'reggis-beta'
                keyPassword secrets.getProperty('password')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.beta
                debuggable false
                minifyEnabled false
            }
        }
    }
    namespace 'org.drvo.reggisapp.android'
    compileSdk 36
    buildFeatures { compose true }
    testOptions { unitTests.includeAndroidResources = true }
    defaultConfig {
        applicationId 'org.drvo.reggisapp.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation project(':reports')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.poi:poi:5.5.1'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'org.apache.poi:poi:5.5.1'
}
